<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lektionsförändringar</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.3rem; }
    .subtitle { font-size: 0.85rem; color: var(--text-sub); }

    .controls { display: flex; gap: 8px; margin-bottom: 16px; }
    select, button {
      background: var(--card-bg); border: 1px solid var(--border);
      color: var(--text-main); padding: 8px 12px; border-radius: 8px; font-size: 0.9rem;
    }
    button { background: var(--accent); color: #000; font-weight: 600; cursor: pointer; border: none; }

    .card-list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background-color: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px;
    }
    .card-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
    .time { color: var(--accent); }
    .details { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
    .info-box {
      margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.2);
      border-radius: 6px; font-size: 0.85rem; color: #e2e8f0;
    }
    .status { text-align: center; padding: 20px; color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Lektionsförändringar</h1>
        <div class="subtitle" id="doc-date">Hämtar data...</div>
      </div>
      <button onclick="fetchData()">Uppdatera</button>
    </header>

    <div class="controls">
      <select id="classSelect" onchange="renderData()">
        <option value="ALL">Visa ALLA ändringar</option>
        <option value="9c1">Klass 9C1</option>
        <option value="7b4">Klass 7B4</option>
        <option value="7c5">Klass 7C5</option>
        <option value="8c1">Klass 8C1</option>
      </select>
    </div>

    <div id="content" class="card-list">
      <div class="status">Laddar...</div>
    </div>
  </div>

  <script>
    const DOC_ID = "1NTQFujZqmydffBEJe9xBYHBFDipH95J_zgpdeaTjFQQ";
    // Proxy för att kringgå CORS-blockering vid lokal körning
    const PROXY_URL = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://docs.google.com/document/d/${DOC_ID}/export?format=txt`)}`;
    
    let parsedData = [];

    async function fetchData() {
      const container = document.getElementById("content");
      container.innerHTML = '<div class="status">Hämtar lektionsändringar...</div>';

      try {
        const response = await fetch(PROXY_URL);
        if (!response.ok) throw new Error("Kunde inte nå dokumentet.");
        
        const text = await response.text();
        parseDocument(text);
        renderData();
      } catch (err) {
        container.innerHTML = `<div class="status" style="color: #ef4444;">Fel vid hämtning: ${err.message}</div>`;
      }
    }

    function parseDocument(text) {
      const lines = text.split("\n");
      parsedData = [];

      lines.forEach(line => {
        if (line.includes("Lektionsförändring")) {
          document.getElementById("doc-date").innerText = line.trim();
        }

        if (line.includes("|")) {
          const cols = line.split("|").map(c => c.trim());
          // Rensa bort tomma kolumner från tabellens kanter
          const cleanCols = cols.filter((c, idx) => idx > 0 && idx < cols.length - 1);

          if (cleanCols.length >= 3) {
            const teacher = cleanCols[0];
            const time = cleanCols[1];
            const lesson = cleanCols[2];
            const substitute = cleanCols[3] || "";
            const details = cleanCols[4] || "";

            // Ignorera rubrikrader och peppinlägg
            if (!teacher.toLowerCase().includes("lärare") && !teacher.includes("Två saker")) {
              parsedData.push({ teacher, time, lesson, substitute, details });
            }
          }
        }
      });
    }

    function renderData() {
      const container = document.getElementById("content");
      const selectedClass = document.getElementById("classSelect").value.toLowerCase();

      let filtered = parsedData;
      if (selectedClass !== "all") {
        filtered = parsedData.filter(item => item.lesson.toLowerCase().includes(selectedClass));
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="status">Inga lektionsändringar hittades.</div>';
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="card-header">
            <span>${item.lesson.toUpperCase()}</span>
            <span class="time">${item.time}</span>
          </div>
          <div class="details">
            <strong>Lärare:</strong> ${item.teacher} | <strong>Vikarie/Åtgärd:</strong> ${item.substitute}
          </div>
          ${item.details ? `<div class="info-box">${item.details}</div>` : ''}
        </div>
      `).join('');
    }

    fetchData();
  </script>
</body>
</html>
